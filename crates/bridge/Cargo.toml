[package]
name = "matter-onvif-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "matter-onvif-bridge"
path = "src/main.rs"

[dependencies]
matter-camera.workspace = true
onvif-client.workspace = true
media.workspace = true

rs-matter = { git = "https://github.com/project-chip/rs-matter", package = "rs-matter", rev = "52c0fcd", features = ["async-io", "zeroconf"] }
tokio.workspace = true
async-channel = "2"
static_cell = "2"
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = "1"

# rs-matter runtime deps (same as examples)
embassy-futures = "0.1"
embassy-time = { version = "0.5", features = ["std"] }
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }
async-io = "2"
futures-lite = "2"
rand = { version = "0.8", features = ["std", "std_rng"] }
socket2 = "0.5"
log = "0.4"
env_logger = "0.11"
hostname = "0.4"

[dev-dependencies]
tempfile = "3"
