# Matter-ONVIF Bridge — Docker Compose
#
# This runs ONLY go2rtc in Docker (RTSP→WebRTC media bridging).
# The Rust bridge runs natively because it needs LAN multicast for:
#   - ONVIF WS-Discovery (UDP 239.255.255.250:3702)
#   - Matter mDNS commissioning (UDP 224.0.0.251:5353)
#
# Usage:
#   docker compose up -d                    # Start go2rtc
#   cargo run -p matter-onvif-bridge        # Start bridge (separate terminal)

services:
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: matter-onvif-go2rtc
    restart: unless-stopped
    volumes:
      - ./docker/go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
    ports:
      # API — used by the bridge to register streams and exchange SDP
      - "${GO2RTC_API_PORT:-1984}:1984"
      # WebRTC UDP — used for ICE/media between controller and go2rtc
      - "${GO2RTC_WEBRTC_PORT:-8555}:8555/tcp"
      - "${GO2RTC_WEBRTC_PORT:-8555}:8555/udp"
    # go2rtc needs to reach RTSP cameras on the LAN.
    # The default bridge network works because RTSP is unicast TCP —
    # Docker NATs outbound connections to cameras just fine.
    network_mode: bridge
